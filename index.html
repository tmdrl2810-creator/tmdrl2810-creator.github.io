<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>멸망해도 출근</title>
<style>
:root { --bg:#fbfaf7; --fg:#22252a; --muted:#666c75; --line:#dcd8cf; --accent:#1f5fbf; --soft:#f1eee7; --todo-bg:#fff3c4; --todo-fg:#6b4e00; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#17191d; --fg:#e7e9ec; --muted:#a0a7b1; --line:#353a42; --accent:#8ab4ff; --soft:#20242a; --todo-bg:#4a3c0c; --todo-fg:#ffe08a; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; font-size:16px; line-height:1.75; word-break:keep-all; overflow-wrap:anywhere; }
.wrap { max-width:760px; margin:0 auto; padding:0 16px 64px; }
header.site { border-bottom:1px solid var(--line); }
header.site .wrap { padding-bottom:0; display:flex; flex-wrap:wrap; gap:4px 20px; align-items:baseline; padding-top:14px; padding-bottom:12px; }
header.site .name { font-weight:700; color:var(--fg); text-decoration:none; margin-right:auto; }
header.site nav a { color:var(--muted); text-decoration:none; margin-left:0; margin-right:14px; font-size:14px; }
header.site nav a[aria-current] { color:var(--fg); font-weight:600; }
a { color:var(--accent); }
h1 { font-size:28px; line-height:1.3; margin:36px 0 12px; }
h2 { font-size:20px; line-height:1.4; margin:40px 0 10px; padding-top:18px; border-top:1px solid var(--line); }
h3 { font-size:17px; margin:26px 0 8px; }
p { margin:10px 0; }
ul, ol { padding-left:22px; margin:8px 0; }
li { margin:6px 0; }
code { font-family:inherit; background:var(--soft); padding:1px 5px; border-radius:4px; }
.table { overflow-x:auto; margin:12px 0; border:1px solid var(--line); border-radius:8px; }
table { border-collapse:collapse; width:100%; font-size:14.5px; line-height:1.6; }
th, td { text-align:left; vertical-align:top; padding:9px 12px; border-bottom:1px solid var(--line); min-width:96px; }
th { background:var(--soft); font-weight:600; white-space:nowrap; }
tbody tr:last-child td { border-bottom:0; }
.todo { background:var(--todo-bg); color:var(--todo-fg); padding:1px 6px; border-radius:4px; font-size:.92em; }
.draft { margin:20px 0 0; padding:12px 14px; border-radius:8px; background:var(--todo-bg); color:var(--todo-fg); font-size:14.5px; }
.cards { display:grid; gap:12px; margin:24px 0; }
.cards a { display:block; padding:16px 18px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--fg); background:var(--soft); }
.cards a strong { display:block; font-size:17px; }
.cards a span { color:var(--muted); font-size:14.5px; }
footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px; }
</style>
</head>
<body>
<header class="site"><div class="wrap"><a class="name" href="./">멸망해도 출근</a><nav><a href="privacy.html">개인정보처리방침</a><a href="terms.html">이용약관</a></nav></div></header>
<main class="wrap">
<p class="draft">출시를 준비하고 있는 게임의 문서입니다. 노란색으로 표시된 항목은 출시 전에 채워집니다.</p>
<h1>멸망해도 출근</h1>
<p>모바일 게임 「멸망해도 출근」의 안내 페이지입니다.</p>
<div class="cards">
<a href="privacy.html"><strong>개인정보처리방침</strong><span>게임이 어떤 정보를 왜 다루는지, 얼마 동안 보관하는지</span></a>
<a href="terms.html"><strong>이용약관</strong><span>게임을 이용할 때의 권리와 의무</span></a>
</div>


<footer>모바일 게임 「멸망해도 출근」</footer>
</main>
</body>
</html>
